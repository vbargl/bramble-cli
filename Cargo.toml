[package]
name = "bramble-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
vault-crypto = { git = "https://github.com/bramble-sh/bramble", rev = "7acadf3ef39202b75879b492a771847261341940", default-features = false, features = ["native"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
